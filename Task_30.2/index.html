<!doctype html>
<html>

<head>
    <title>Task_30.2</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <!-- overall wrapper-->
    <main class="home-wrapper">
        <!-- home -->
        <section class="home">
            <!-- card container -->
            <aside class="card-container">
                <div class="card">
                    <i class="fa-solid fa-location-dot side-icon"></i>
                    <h3 class="side-category">Address</h3>
                    <p class="side-content">Random Building,</p>
                    <p class="side-content">Random Street</p>
                </div>
                <div class="card mid-card">
                    <i class="fa-solid fa-phone side-icon"></i>
                    <h3 class="side-category">Phone</h3>
                    <p class="side-content">+00 121 122 1211</p>
                    <p class="side-content">+00 122 012 0121</p>
                </div>
                <div class="card">
                    <i class="fa-solid fa-envelope side-icon"></i>
                    <h3 class="side-category">Email</h3>
                    <p class="side-content">randommail@email.com</p>
                    <p class="side-content">anothermail@email.com</p>
                </div>
            </aside>
            <div class="line-container">
                <div class="line"></div>
            </div>
            <!-- form -->
            <form class="form">
                <h2 class="title">Send us a message</h2>
                <p class="desc">If you have any work for me or any type of queries related to my tutorial, you can send
                    me message from here. It's my plesure to help you.</p>
                <input type="text" name="name" id="name" class="name" placeholder="Enter your name" />
                <br />
                <input type="email" name="email" id="email" class="email" placeholder="Enter your email" />
                <div class="message-container">
                    <textarea name="message" id="message" class="message" placeholder="Enter your message"></textarea>
                </div>
                <input type="button" value="Send Now" class="form-btn" />
            </form>
        </section>
    </main>
</body>

</html>
