<!doctype html>
<html>
	<head>
		<title>Task_19.3</title>
		<style>
			* {
				margin:0;
				padding:0;
				box-sizing:border-box;
				border:none;
			}
			body {
				background-color:#121212;
				color:#ADADAD;
			}
			form {
				width:400px;
				margin:20px auto 0 auto;
				background-color:#252525;
				padding:20px;
				border-radius:10px;
			}
			h1 {
				margin:0 0 20px 0;
			}
			input {
				margin:5px 0 10px 0;
				background-color:#131313;
				border:1px solid white;
				color:white;
			}
			.text {
				width:100%;
				height:30px;
			}
			.file {
				width:100%;
			}
			.submit {
				margin:5px 0 0 0;
				padding:5px 20px;
				border-radius:5px;
				border:none;
			}
		</style>
	</head>
	<body>
		<form>
			<h1>Input Types</h1>
			<label>Name:</label>
			<br/>
			<input type="text" class="text"/>
			<br/>
			<label>Email:</label>
			<br/>
			<input type="email" class="text"/>
			<br/>
			<label>Password:</label>
			<br/>
			<input type="password" class="text"/>
			<br/>
			<label>Age:</label>
			<br/>
			<input type="number" class="text"/>
			<br/>
			<label>DOB:</label>
			<br/>
			<input type="date" class="text"/>
			<br/>
			<label>Gender:</label>
			<br/>
			<input type="radio" name="gender"/>
			<label>Male</label>
			<br/>
			<input type="radio" name="gender"/>
			<label>Female</label>
			<br/>
			<label>Skill:</label>
			<br/>
			<input type="Checkbox" name="skill"/>
			<label>React</label>
			<br/>
			<input type="Checkbox" name="skill"/>
			<label>Database</label>
			<br/>
			<input type="Checkbox" name="skill"/>
			<label>Java</label>
			<br/>
			<label>Resume:</label>
			<br/>
			<input type="file" class="file"/>
			<br/>
			<input type="button" value="Submit" class="submit"/>

		</form>
	</body>
</html>
