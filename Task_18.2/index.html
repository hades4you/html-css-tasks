<!doctype html>
<html>
	<head>
		<title>Task_18.2</title>
		<style>
			* {
				margin:0;
				padding:0;
				box-sizing:border-box;
			}
			body {
				background-color:#101214;
			}
			table,th,td {
				border:3px solid #C7C7C7;
				font-size:26px;
				border-radius:10px;
				padding:15px;
				text-align:center;
			}
			table {
				border:4px solid #C7C7C7;	
				background-color:#17191B;
				padding:4px;
				width:20%;
				margin:0 auto;
				border-radius:0;
			}
			th {
				text-align:right;
				color:#E6E6E6;
			}
			td {
				color:#E6E6E6;
			}
			.default-col {
				width:26.6%;
				background-color:#25292D;
			}
			.operator-col {
				width:20%;
			}
			.title {
				text-align:center;
				margin:5px 0 15px 0;
				background-color:#1C1F22;
				border:1px solid #B8892D;
				color:#F2F0EA;
			}
			.accent-1-bg {
				background-color:#B8892D;
				color:#101214;
			}
			.accent-2-bg {
				background-color:#8F2D35;
				color:#FFFFFF;
			}
			.accent-3-bg {
				background-color:#237A72;
				color:#FFFFFF;
			}
		</style>
	</head>
	<body>
		<h1 class="title">Calci</h1>
		<table>
			<colgroup>
				<col span="3" class="default-col"/>
				<col span="1" class="operator-col"/>
			</colgroup>
			<tr>
				<th colspan="4">0</th>
			</tr>
			<tr>
				<td class="accent-1-bg">(</td>
				<td class="accent-1-bg">)</td>
				<td class="accent-1-bg">%</td>
				<td class="accent-1-bg">/</td>
			</tr>
			<tr>
				<td>7</td>
				<td>8</td>
				<td>9</td>
				<td class="accent-1-bg">x</td>
			</tr>
			<tr>
				<td>4</td>
				<td>5</td>
				<td>6</td>
				<td class="accent-1-bg">-</td>
			</tr>
			<tr>
				<td>1</td>
				<td>2</td>
				<td>3</td>
				<td rowspan="2" class="accent-1-bg">+</td>
			</tr>
			<tr>
				<td class="accent-2-bg">Del</td>
				<td>0</td>
				<td class="accent-3-bg">=</td>
			</tr>
		</table>
	</body>
</html>
