<!doctype html>
<html>

<head>
  <title>Task_28.1</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border: none;
      outline: none;
    }

    body {
      background-color: #121212;
      color: white;
    }

    input {
      height: 30px;
      border: 1px solid white;
      background-color: #383838;
      border-radius: 5px;
      margin: 2px 0 0 0;
    }

    .main {
      margin: 50px auto 0 auto;
      width: 350px;
      background-color: burlywood;
    }

    .header {
      text-align: center;
      background-color: #0077ff;
    }

    .form {
      padding: 20px;
      background-color: #383838;
    }

    .form-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 0 0 10px 0;
    }

    .fname-container,
    .lname-container {
      width: 50%;
    }

    .fname,
    .lname {
      width: 100%;
    }

    .gen-inp {
      width: 100%;
      margin: 2px 0 10px 0;
    }

    .gender-container {
      margin: 3px auto 10px auto;
      padding: 8px 0;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
      width: 70%;
      border: 1px solid white;
      background-color: #0077ff31;
    }

    .gender {
      padding: 2px 15px;
    }

    .male {
      background-color: #0077ff;
      border-radius: 20px;
    }

    .register {
      width: 100%;
      border: none;
      color: white;
      background-color: #0077ff;
      ;
    }
  </style>
</head>

<body>
  <!-- main -->
  <main class="main">
    <!-- form header -->
    <h2 class="header">REGISTRATION FORM</h2>
    <form class="form">
      <!-- name container -->
      <div class="form-top">
        <div class="fname-container">
          <label for="fname" class="fname-label">First Name</label>
          <br />
          <input type="text" id="fname" class="fname" />
        </div>
        <div class="lname-container">
          <label for="lname" class="lname-label">Last Name</label>
          <br />
          <input type="text" id="lname" class="lname" />
        </div>
      </div>
      <label for="email" class="email-label">Email</label>
      <br />
      <input type="email" id="email" class="email gen-inp" />
      <br />
      <label for="city" class="city-label">City</label>
      <br />
      <input type="text" id="city" class="city gen-inp" />
      <br />
      <label for="country" class="country-label">Country</label>
      <br />
      <input type="text" id="country" class="country gen-inp" />
      <br />
      <label class="gender-label">Gender</label>
      <!-- gender div -->
      <div class="gender-container">
        <p class="gender male">Male</p>
        <p class="gender female">Female</p>
      </div>
      <!-- register btn -->
      <input type="submit" value="REGISTER NOW" class="register" />
    </form>
  </main>
</body>

</html>
