<!doctype html>
<html>

<head>
    <title>Task_50.1</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <!-- overall page -->
    <div class="page">
        <!-- card 1 -->
        <div class="card card-1">
            <!-- blue boxes -->
            <div class="blue-box blue-box-1"></div>
            <div class="blue-box blue-box-2"></div>
            <!-- card top -->
            <div class="card-top">
                <img src="./edward_kenway_sq.jpg" alt="edward-kenway" class="profile-pic" />
                <h1>Edward Kenway</h1>
                <div class="top-line"></div>
                <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Repellendus, maiores.</p>
            </div>
            <!-- card middle -->
            <div class="card-mid">
                <i class="fa-solid fa-plus"></i>
                <i class="fa-brands fa-whatsapp"></i>
                <i class="fa-solid fa-envelope"></i>
            </div>
            <!-- card bottom -->
            <div class="card-bottom">
                <div class="social">
                    <i class="fa-brands fa-facebook"></i>
                    <i class="fa-brands fa-whatsapp"></i>
                    <i class="fa-brands fa-instagram"></i>
                    <i class="fa-brands fa-linkedin"></i>
                </div>
            </div>
            <!-- red box -->
            <div class="red-box"></div>
        </div>
        <!-- card 2 -->
        <div class="card card-2">
            <!-- card top -->
            <div class="card-top">
                <img src="./shay_cormac_sq.jpg" alt="shay-cormac" class="profile-pic" />
                <h1>Shay Cormac</h1>
                <div class="top-line"></div>
                <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Repellendus, maiores.</p>
            </div>
            <!-- card middle -->
            <div class="card-mid">
                <div class="icon-container">
                    <i class="fa-solid fa-plus"></i>
                </div>
                <div class="icon-container">
                    <i class="fa-brands fa-whatsapp"></i>
                </div>
                <div class="icon-container">
                    <i class="fa-solid fa-envelope"></i>
                </div>
            </div>
            <!-- card bottom -->
            <div class="card-bottom">
                <div class="social">
                    <i class="fa-brands fa-facebook"></i>
                    <i class="fa-brands fa-whatsapp"></i>
                    <i class="fa-brands fa-instagram"></i>
                    <i class="fa-brands fa-linkedin"></i>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
