<!doctype html>
<html>
	<head>
		<title>Task_14.5</title>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	</head>
	<body style="background-color:grey;color:white;margin:0">
		<!--main div-->
		<div style="width:300px;margin:50px auto 0 auto">
			<!--card 1-->
			<div style="background-color:#252525;width:100%;display:flex;justify-content:space-between;padding:20px;box-sizing:border-box">
				<!--left side-->
				<div>
					<p style="margin:0">MATCHES WON</p>
					<h1 style="margin:5px 0 0 0;font-size:38px">48</h1>
					<p style="margin:5px 0 0 0;font-size:12px"><i class="fa-solid fa-arrow-up" style="font-size:8px;color:#22C55E"></i><span style="color:#22C55E"> +20%</span> vs last 28 days</p>
				</div>
				<!--right side-->
				<div>
					<i class="fa-solid fa-award" style="font-size:30px;padding:20px;box-sizing:border-box;background-color:#243B8A;color:#F4C542;width:70px;height:70px;border-radius:50%"></i>	
				</div>
			</div>
			<!--card 2-->
			<div style="background-color:#252525;width:100%;display:flex;justify-content:space-between;padding:20px;box-sizing:border-box;margin:20px 0 0 0">
				<!--left side-->
				<div>
					<p style="margin:0">MATCHES LOST</p>
					<h1 style="margin:5px 0 0 0;font-size:38px">16</h1>
					<p style="margin:5px 0 0 0;font-size:12px"><i class="fa-solid fa-arrow-down" style="font-size:8px;color:#EF4444"></i><span style="color:#EF4444"> -20%</span> vs last 28 days</p>
				</div>
				<!--right side-->
				<div>
					<i class="fa-solid fa-heart-crack" style="font-size:30px;padding:20px;box-sizing:border-box;background-color:#B23A48;color:#111111;width:70px;height:70px;border-radius:50%"></i>	
				</div>
			</div>
		</div>
	</body>
</html>
