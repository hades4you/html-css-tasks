<!doctype html>
<html>
	<head>
		<title>Task_19.1</title>
		<style>
			* {
				margin:0;
				padding:0;
				box-sizing:border-box;
			}
			body {
				background-color:#0B0D10;
			}
			.login-form {
				background-color:#181B20;
				margin:50px auto 0 auto;
				width:350px;
				padding:20px;
			}
			.form-title,.new-user,.or {
				text-align:center;
			}
			.form-title {
				margin:0 0 20px 0;
				color:#4D7CFE;
			}
			.form-label {
				color:#D9DEE7;
			}
			.form-email {
				margin:10px 0 10px 0;
			}
			.form-password {
				margin:10px 0 0 0;
			}
			.form-input {
				width:100%;
				height:35px;
				border-radius:5px;
				background-color:#252A31;
				border:1px solid #D9DEE7;
			}
			.login {
				color:white;
				margin:15px 0 0 0;
				width:100%;
				height:35px;
				border:none;
				background-color:#4D7CFE;
				border-radius:5px;
			}
			.or-container {
				width:35px;
				height:35px;
				margin:20px auto;
				border-radius:50%;
				background-color:#252A31;
				display:flex;
				justify-content:center;
				align-items:center;
			}
			.general-text {
				margin:2px 0 0 0;
			}
			.alternate-container {
				width:100%;
				height:35px;
				display:flex;
				justify-content:space-between;
				align-items:center;
			}
			.alternate {
				color:white;
				width:45%;
				height:100%;
				border:none;
				border-radius:5px;
			}
			.new-user,.or {
				color:#9299A5;
			}
			.highlights {
				color:#8EACFF;
			}
			.fb-button {
				background-color:#4267B2;
			}
			.gl-button {
				background-color:#DB4437;
			}
		</style>
	</head>
	<body>
		<!--form start-->
		<form class="login-form">
			<h2 class="form-title">LOGIN</h2>
			<label class="form-label">Email</label>
			<br/>
			<input type="email" class="form-email form-input"/>
			<br/>
			<label class="form-label">Password</label>
			<br/>
			<input type="password"  class="form-password form-input"/>
			<p class="highlights general-text">Forgot password?</p>
			<input type="button" value="Login" class="login"/>
			<p class="new-user general-text">New to our platform? <span class="highlights">Signup</span></p>
			<!--OR div-->
			<div class="or-container">
				<p class="or">Or</p>
			</div>
			<!--button div-->
			<div class="alternate-container">
				<button class="alternate fb-button">Facebook</button>
				<button class="alternate gl-button">Google</button>
			</div>
		</form>
	</body>
</html>
