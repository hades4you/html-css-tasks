<!doctype html>
<html>

<head>
    <title>Task_35.4</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <!-- page -->
    <div class="page">
        <!-- main -->
        <main class="main">
            <!-- form area -->
            <form class="form">
                <!-- form title -->
                <h1 class="form-title">Send us a message</h1>
                <div class="input-container">
                    <input type="text" id="uname" name="uname" class="uname" placeholder="Name" />
                </div>
                <div class="input-container">
                    <input type="email" id="email" name="email" class="email" placeholder="Email" />
                </div>
                <div class="input-container">
                    <input type="text" id="subject" name="subject" class="subject" placeholder="Subject" />
                </div>
                <!-- message box -->
                <div class="message-container">
                    <textarea name="message" id="message" class="message" placeholder="Message"></textarea>
                </div>
                <!-- form btn -->
                <div class="form-btn-container">
                    <button class="send-btn">Send Message</button>
                </div>
            </form>
            <!-- contact area -->
            <section class="contact-area">
                <!-- contact header -->
                <header class="contact-header">
                    <h1 class="contact-title"><span>Cont</span>act us</h1>
                    <p>We're open for any suggestion or just to have a chat!</p>
                </header>
                <!-- contact table -->
                <table class="contact-table">
                    <tr>
                        <td>
                            <i class="fa-solid fa-location-dot"></i>
                        </td>
                        <td>
                            <p>Adress: #000, Random Street, Random Area, Random City 000000</p>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <i class="fa-solid fa-phone"></i>
                        </td>
                        <td>
                            <p>Phone: <span class="faded-text">+00 010 101 1001</span></p>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <i class="fa-regular fa-envelope"></i>
                        </td>
                        <td>
                            <p>Email: <span class="faded-text">contact@info.com</span></p>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <i class="fa-solid fa-globe"></i>
                        </td>
                        <td>
                            <p>Website: <span class="faded-text">yoursite.com</span></p>
                        </td>
                    </tr>
                </table>
            </section>
        </main>
    </div>
</body>

</html>
