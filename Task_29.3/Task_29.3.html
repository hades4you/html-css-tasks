<!doctype html>
<html>

<head>
    <title>Task_29.3</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <!-- overall div -->
    <div class="overall">
        <!-- ticket -->
        <main class="ticket">
            <!-- film details -->
            <header class="header">
                <div class="header-left">
                    <h1>Cyberpunk 2077</h1>
                    <div class="category-container">
                        <p class="category">A</p>
                        <p class="category">English</p>
                        <p class="category">3D</p>
                    </div>
                    <div class="location-container">
                        <i class="fa-solid fa-location-dot"></i>
                        <h3 class="location">PVR SATHYAM Chennai</h3>
                    </div>
                </div>
                <img class="movie-poster" src="./cyberpunk-cover-art.jpg" alt="movie-poster">
            </header>
            <!-- cut mark -->
            <section class="mid-area">
                <p class="mid-line">- - - - - - - - - - - - </p>
                <p class="mid-text">SCAN QR CODE AT CINEMA</p>
                <p class="mid-line">- - - - - - - - - - - - </p>
            </section>
            <!-- screening details -->
            <footer class="footer">
                <div class="footer-top">
                    <div class="seating-details">
                        <div class="seating-top">
                            <div class="seating-top-details">
                                <p class="seating-grey-text">Sat, 12 Sept '26</p>
                                <h2>10:15 PM</h2>
                            </div>
                            <div class="seating-top-details">
                                <p class="seating-grey-text">Screen</p>
                                <h2>6 DEGREES</h2>
                            </div>
                        </div>
                        <div class="seating-bottom">
                            <div class="seating-bottom-details">
                                <p class="seating-grey-text">Seat</p>
                                <h2>PRIME - C8, C9</h2>
                            </div>
                        </div>
                    </div>
                    <div class="qr-container">
                        <img class="qr-img" src="./cyberpunk-qr.png" alt="qr">
                    </div>
                </div>
                <p class="footer-bottom"><b><span class="bottom-grey-text">BOOKING ID : </span>SATH0000012212</span></p>
            </footer>
        </main>
        <!-- brand promotion -->
        <footer class="overall-footer">
            <p class="footer-left">Your destination for movie ticket bookings!</p>
            <div class="footer-right"><img class="steam-logo" src="./steam-logo.png" alt="steam-logo"></div>
        </footer>
    </div>
</body>

</html>
