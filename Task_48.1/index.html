<!doctype html>
<html>

<head>
    <title>Task_48.1</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
    <!-- overall page -->
    <div class="page">
        <!-- card -->
        <div class="card">
            <!-- title -->
            <h1>For Login to App</h1>
            <!-- hover text -->
            <p>Hover me!</p>
            <!-- plant pic -->
            <img src="./bonsai.png" alt="bonsai" class="plant-img" />
            <!-- form -->
            <form class="login-form">
                <!-- username -->
                <div class="input-container">
                    <label for="uname">Name:</label>
                    <input type="text" id="uname" name="uname" class="uname" />
                </div>
                <!-- password -->
                <div class="input-container">
                    <label for="pwd">Password:</label>
                    <input type="password" id="pwd" name="pwd" class="pwd" />
                </div>
                <!-- login btn -->
                <div class="btn-container">
                    <button class="form-btn"><b>Login</b></button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
