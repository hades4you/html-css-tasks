<!doctype html>
<html>

<head>
    <title>Task_50.2</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <!-- overall page -->
    <div class="page">
        <!-- page title -->
        <h1>About Us</h1>
        <!-- home area -->
        <main class="home">
            <!-- left side img container -->
            <section class="hero-img-container">
                <img src="./truimph-scrambler-900.jpg" alt="triumph" class="hero-img" />
            </section>
            <!-- right side content section -->
            <section class="content-section">
                <!-- top portion of the content section -->
                <div class="content-top">
                    <!-- rectangle frame at the content section -->
                    <div class="rectangle-frame"></div>
                    <!-- text visible over the rectangle frame -->
                    <div class="content-top-text">
                        <div>
                            <h2>Our workshop's mission lies in providing quality care for bikes.</h2>
                            <p>We want our clients and the bikes to revieve the best servies and parts, that's why we
                                work
                                only with proven and respected manufacturers.</p>
                        </div>
                        <p><span>READ MORE</span></p>
                    </div>
                </div>
                <!-- bottom part of the content section with the numbers -->
                <div class="content-bottom">
                    <!-- box 1 -->
                    <div class="box">
                        <div class="square-box"></div>
                        <h1>01</h1>
                        <p>OUR MISSION</p>
                    </div>
                    <!-- box 2 -->
                    <div class="box">
                        <h1>02</h1>
                        <p>OUR VISION</p>
                    </div>
                    <!-- box 3 -->
                    <div class="box">
                        <h1>03</h1>
                        <p>OUR VALUES</p>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
