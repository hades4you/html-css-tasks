<!doctype>
<html>
	<head>
		<title>Task_12.2</title>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	</head>
	<body style="margin:0;background-color:darkgrey">
		<!--card-->
		<div style="margin:50px auto 0 auto;width:300px;background-color:white;border-radius:5px">
			<img src="./joseph_seed.jpg" alt="joseph_seed" style="width:100%;border-radius:5px 5px 0 0"/>
			<!--content div-->
			<div style="margin:20px 0 0 0;text-align:center;padding:20px">
				<h2 style="margin:0">Joseph Seed</h2>
				<p style="margin:10px 0 0 0;text-align:justify">Joseph Seed is a confident and charismatic leader with a strong presence and mysterious personality.</p>
				<h2 style="margin:20px 0 10px 0">Contact</h2>
				<!--icon div-->
				<div style="margin:0;font-size:20px;padding:10px 0;box-sizing:border-box;border-bottom:1px solid grey;color:#303030">
					<i class="fa-brands fa-facebook-f" style="margin:0 15px 0 0"></i>
					<i class="fa-brands fa-x-twitter" style="margin:0 15px 0 0"></i>
					<i class="fa-brands fa-google" style="margin:0 15px 0 0"></i>
					<i class="fa-brands fa-github" style="margin:0 15px 0 0"></i>
					<i class="fa-brands fa-square-linkedin"></i>
				</div>
				<!--button div-->
				<div style="margin:0;padding-top:20px">
					<button style="font-size:14px;width:40%;height:35px;padding:8px 0;margin:0 40px 0 0;background-color:#ff9f19;border:none;color:white;border-radius:2px">Contact Me</button>
					<button style="font-size:14px;width:40%;height:35px;padding:8px 0;border:solid 2px #ff9f19;box-sizing:border-box;background-color:white;border-radius:2px">Join Me</button>
				</div>
			</div>
		</div>
	</body>
</html>
