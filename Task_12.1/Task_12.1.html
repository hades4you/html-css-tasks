<!doctype html>
<html>
	<head>
		<title></title>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	</head>
	<body style="margin:0;background-color:grey">
		<!--card-->
		<div style="width:300px;background-color:white;margin:50px auto 0 auto;padding:15px;box-sizing:border-box;border:5px solid black;border-radius:10px">
			<!--badge-->
			<p style="background-color:black;color:white;width:40%;text-align:center;padding:5px;box-sizing:border-box;margin:0;border-radius:3px">Best Seller</p>
			<!--image div-->
			<div style="width:100%;margin:20px 0 0 0;text-align:center">
				<img src="./headphone.png" alt="headphone" style="width:70%"/>
			</div>
			<!--content div-->
			<h3 style="margin:20px 0 0 0">Wireless Bluetooth Headset</h3>
			<p style="margin:15px 0 0 0;color:grey">shipped in 3-4 days</p>
			<p style="margin:0">$10.99</p>
			<!--button div-->
			<div style="margin:10px 0 0 0;width:100%;text-align:center">
				<button style="width:45%;padding:10px 0;font-size:14px;margin:0 8.4% 0 0;border:none;background-color:grey;border-radius:5px"><i class="fa-solid fa-cart-plus"></i><span>Add Cart<span></button>
				<button style="width:45%;padding:10px 0;font-size:14px;background-color:black;color:red;border:none;border-radius:5px"><i class="fa-solid fa-bag-shopping"></i><span>Buy</span></button>
			</div>
		</div>
	</body>
</html>
