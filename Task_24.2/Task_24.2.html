<!doctype html>
<html>
	<head>
		<title>Task_24.2</title>
		<style>
			* {
				margin:0;
				padding:0;
				box-sizing:border-box;
				border:none;
				outline:none;
			}
			body {
				background-color:#121212;
				color:white;
			}
			.main {
				width:600px;
				margin:50px auto 0 auto;
				background-color:#444444;
			}
			.top-section {
				width:100%;
				padding: 30px;
			}
			.heading {
				text-align:center;
			}
			.form-container {
				margin:10px 0 0 0;
				width:100%;
				height:150px;
				display:flex;
				justify-content:space-between;
			}
			.login-option-container {
				display: flex;
				justify-content: center;
				align-items: center;
			}
			.login-option {
				display: flex;
				align-items: center;
				width:100%;
				height:30%;
				padding: 0 10px;
				gap:10px;
				border-radius: 5px;
			}
			.mid-option {
				margin:7px 0;
			}
			.primary-div {
				width:45%;
			}
			.line-top {
				margin:0 auto;
				background-color: white;
				height: 60%;
				width:2px;
			}
			.line-bottom {
				margin:0 auto;
				background-color: white;
				width:2px;
				height:23.5%;

			}
			.line-mid {
				margin:0 auto;
				width:25px;
				height:25px;
				display:flex;
				justify-content:center;
				background-color:#141414;
				align-items:center;
				border-radius:50%;
			}
			input::placeholder {
				color: #e6e6e6;
			}
			.input-options {
				height: 30%;
				width:100%;
				border-radius:5px;
				background-color: #272727;
				padding:5px;
			}
			.uname {
				border: 2px solid black;
			}
			.login-form {
				height: 90%;
			}
			.form-base {
				height:100%;
				display: flex;
				justify-content: center;
				align-items: center;
			}
			.options-base {
				height: 90%;
				width: 100%;
			}
			.footer {
				width: 100%;
				display: flex;
			}
			.footer-btn {
				width: 50%;
				padding: 15px;
			}
			.facebook {
				background-color:#2b91fb;
			}
			.twitter {
				background-color:#2bcffb;
			}
			.google {
				background-color:#fb2b2b;
			}
			.login-btn {
				color: white;
				background-color:#141414;
			}
		</style>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
	</head>
	<body>
		<!-- main -->
		<main class="main">
			<section class="top-section">
				<h2 class="heading">Login</h2>
				<div class="form-container">
					<div class="login-option-container primary-div">
						<div class="options-base">
							<div class="login-option facebook"><i class="fa-brands fa-facebook-f"></i><p>Facebook</p></div>
							<div class="login-option mid-option twitter"><i class="fa-brands fa-twitter"></i><p>Twitter</p></div>
							<div class="login-option google"><i class="fa-brands fa-google"></i><p>Google+</p></div>
						</div>
					</div>
					<div class="line-container">
						<div class="line-top">
						</div>
						<div class="line-mid">
							<p>or</p>
						</div>
						<div class="line-bottom">
						</div>
					</div>
					<div class="form-base primary-div">
						<form class="login-form">
							<input type="text" placeholder="username" class="uname input-options">
							<input type="password" placeholder="password" class="pwd input-options mid-option">
							<input type="submit" value="Login" class="login-btn input-options">
						</form>
					</div>
				</div>
			</section>
			<footer class="footer">
				<button class="footer-btn">Sign Up</button>
				<button class="footer-btn">Forgot Password?</button>
			</footer>
		</main>
	</body>
</html>
