			* {
				margin:0;
				padding:0;
				box-sizing:border-box;
			}
			body {
				background-color:#E8EBEF;
			}
			.home {
				margin:50px auto 0 auto;
				width:70%;
				border:2px solid #4A5D73;
				padding:20px;
				border-radius:5px;
			}
			table,th,td {
				border:1px solid #B7BDC5;
				text-align:center;
				padding:10px 10px;
				color:#303640;
				border-collapse:collapse;
			}
			table {
				width:100%;
			}
			th {
				background-color:#4A5D73;
				color:#FFFFFF;
			}
			.agent-img {
				background-color:#D5DCE4;
				width:70px;
				border-radius:50%;
				border:5px solid #8C96A3;
			}
			.img-container {

				align-items:center;
			}
			.agent-button {
				padding:5px 15px;
				border-radius:2px;
			}
			.button-container {
				display:flex;
				justify-content:center;
				align-items:center;
				gap:10px;
			}
			.left-button {
				background-color:#DCE1E7;
				border:2px solid #9AA3AE;
				color:#303640;
			}
			.right-button {

			}
			.set-1 {
