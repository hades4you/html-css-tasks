<!doctype html>
<html>

<head>
    <title>Task_36.1</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- page -->
    <div class="page">
        <!-- form -->
        <form class="form">
            <!-- form title -->
            <h2 class="form-title"><span>Re</span>gistration</h2>
            <!-- text input area -->
            <div class="text-input-area">
                <!-- input row 1 -->
                <div class="input-row">
                    <!-- fname container -->
                    <div class="input-container">
                        <label for="fname">Full Name</label>
                        <input type="text" name="fname" id="fname" class="fname" placeholder="Enter your name">
                    </div>
                    <!-- uname container -->
                    <div class="input-container">
                        <label for="uname">Username</label>
                        <input type="text" name="uname" id="uname" class="uname" placeholder="Enter your username">
                    </div>
                </div>
                <!-- input row 2 -->
                <div class="input-row">
                    <!-- email container -->
                    <div class="input-container">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" class="email" placeholder="Enter your email">
                    </div>
                    <!-- phone container -->
                    <div class="input-container">
                        <label for="phone">Phone Number</label>
                        <input type="number" name="phone" id="phone" class="phone" placeholder="Enter your number">
                    </div>
                </div>
                <!-- input row 3 -->
                <div class="input-row">
                    <!-- pwd-1 container -->
                    <div class="input-container">
                        <label for="pwd-1">Password</label>
                        <input type="password" name="pwd-1" id="pwd-1" class="pwd-1" placeholder="Enter your password">
                    </div>
                    <!-- pwd-2 container -->
                    <div class="input-container">
                        <label for="pwd-2">Confirm Password</label>
                        <input type="password" name="pwd-2" id="pwd-2" class="pwd-2"
                            placeholder="Confirm your password">
                    </div>
                </div>
            </div>
            <!-- gender container -->
            <div class="gender-container">
                <!-- gender title -->
                <h3>Gender</h3>
                <!-- gender btn row -->
                <div class="radio-row">
                    <div class="radio-container">
                        <input type="radio" name="gender" id="male" class="gender-btn">
                        <label for="male">Male</label>
                    </div>
                    <div class="radio-container">
                        <input type="radio" name="gender" id="female" class="gender-btn">
                        <label for="female">Female</label>
                    </div>
                    <div class="radio-container">
                        <input type="radio" name="gender" id="prefer-not-to-say" class="gender-btn">
                        <label for="prefer-not-to-say">Prefer not to say</label>
                    </div>
                </div>
            </div>
            <div class="form-btn-container">
                <button><b>Register</b></button>
            </div>
        </form>
    </div>
</body>

</html>
