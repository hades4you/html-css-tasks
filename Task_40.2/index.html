<!doctype html>
<html>

<head>
    <title>Task_40.2</title>
    <link rel="stylesheet" href="./style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <body>
        <!-- overall page -->
        <div class="page">
            <!-- home -->
            <main class="home">
                <!-- contacts section -->
                <section class="contact">
                    <!-- card 1 -->
                    <div class="contact-card">
                        <div class="icon-container">
                            <i class="fa-regular fa-map"></i>
                        </div>
                        <h3>Address</h3>
                        <div class="card-details">
                            <p>#000, Random Street</p>
                            <p>Random Area 000000</p>
                        </div>
                    </div>
                    <!-- card 2 -->
                    <div class="contact-card">
                        <div class="icon-container">
                            <i class="fa-solid fa-phone"></i>
                        </div>
                        <h3>Phone</h3>
                        <div class="card-details">
                            <p>+00 100 011 1001</p>
                            <p>+00 011 100 0111</p>
                        </div>
                    </div>
                    <!-- card 3 -->
                    <div class="contact-card">
                        <div class="icon-container">
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                        <h3>Email</h3>
                        <div class="card-details">
                            <p>infomail@gmail.com</p>
                            <p>randommail@email.com</p>
                        </div>
                    </div>
                </section>
                <!-- middle line container -->
                <section class="line-container">
                    <div class="line"></div>
                </section>
                <!-- form -->
                <form class="form">
                    <!-- form title -->
                    <h2>Send us a message</h2>
                    <!-- form desc -->
                    <p>If you have any work from me or any types of related to my tutorial, you can send me message from
                        here. It's my plesure to help you.</p>
                    <input type="text" id="name" name="name" class="name" placeholder="Enter your name" />
                    <input type="email" id="email" name="email" class="email" placeholder="Enter your email" />
                    <textarea name="message" id="message" class="message" placeholder="Enter your message" /></textarea>
                    <!-- form btn -->
                    <button class="send-btn"><b>Send Now</b></button>
                </form>
            </main>
        </div>
    </body>
</body>

</html>
