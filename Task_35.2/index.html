<!doctype html>
<html>

<head>
    <title>Task_35.2</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <!-- page -->
    <main class="page">
        <!-- home area -->
        <div class="home">
            <!-- header section -->
            <header class="header">
                <!-- title -->
                <h1>Contact Form</h1>
                <!-- contact details ccontainer -->
                <div class="contacts">
                    <!-- contact card 1 -->
                    <article class="card">
                        <div class="icon-container">
                            <i class="fa-solid fa-location-dot"></i>
                        </div>
                        <p><b>Address:</b> #000, Random Street, Random City 000000</p>
                    </article>
                    <!-- contact card 2 -->
                    <article class="card">
                        <div class="icon-container">
                            <i class="fa-solid fa-phone"></i>
                        </div>
                        <p><b>Phone:</b> <span class="blue-text">+00 000 000 0000</span></p>
                    </article>
                    <!-- contact card 3 -->
                    <article class="card">
                        <div class="icon-container">
                            <i class="fa-solid fa-paper-plane"></i>
                        </div>
                        <p><b>Email:</b> <span class="blue-text">contact@site.com</span></p>
                    </article>
                    <!-- contact card 4 -->
                    <article class="card">
                        <div class="icon-container">
                            <i class="fa-solid fa-globe"></i>
                        </div>
                        <p><b>Website:</b> <span class="blue-text">contactsite.com</span></p>
                    </article>
                </div>
            </header>
            <!-- form and img container -->
            <section class="form-container">
                <!-- form -->
                <form class="form">
                    <!-- form title -->
                    <h1>Contact Us</h1>
                    <!-- input row -->
                    <div class="input-row">
                        <!-- unanme -->
                        <div class="input-container">
                            <label for="uname"><b>FULL NAME</b></label>
                            <input type="text" name="uname" id="uname" class="uname" placeholder="Name">
                        </div>
                        <!-- email -->
                        <div class="input-container">
                            <label for="email"><b>EMAIL ADDRESS</b></label>
                            <input type="email" name="email" id="email" class="email" placeholder="Email">
                        </div>
                    </div>
                    <!-- subject -->
                    <div class="input-container">
                        <label for="subject"><b>SUBJECT</b></label>
                        <input type="text" name="subject" id="subject" class="subject" placeholder="Subject">
                    </div>
                    <div class="message-container">
                        <label for="message"><b>MESSAGE</b></label>
                        <textarea name="message" id="message" class="message" placeholder="Message"></textarea>
                    </div>
                    <div class="btn-container">
                        <button class="send-btn"><b>Send Message</b></button>
                    </div>
                </form>
                <!-- wolf img -->
                <img src="./wolf-resized.jpg" alt="wolf" class="wolf-img" />
            </section>
        </div>
    </main>
</body>

</html>
