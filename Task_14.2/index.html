<!doctype html>
<html>
	<head>
		<title>Task_14.2</title>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	</head>
	<body style="margin:0;background-color:grey;color:white">
		<!--main div-->
		<div style="width:500px;background-color:black;text-align:center;padding:30px;box-sizing:border-box;border-radius:20px;border:2px solid white;margin:50px auto 0 auto">
			<img src="./arthur_morgan.jpg" alt="arthur_morgan" style="width:30%;border-radius:50%;border:2px solid white;padding:4px;box-sizing:border-box"/>
			<h2 style="margin:20px 0 0 0">Arthur Morgan</h2>
			<p style="margin:10px 0 0 0">Outlaw from The Wild West</p>
			<!--location div-->
			<div style="display:flex;justify-content:center;margin:10px 0 0 0">
				<i class="fa-solid fa-location-dot"></i>
				<p style="margin:0">Last seen at Valentine</p>
			</div>
			<!--social div-->
			<div style="display:flex;justify-content:space-evenly;margin:30px 0 0 0">
				<div>
					<h3 style="margin:0">2</h3>
					<p style="margin:0">Crimes</p>
				</div>
				<div>
					<h3 style="margin:0">5</h3>
					<p style="margin:0">Hunters</p>
				</div>
				<div>
					<h3 style="margin:0">$100</h3>
					<p style="margin:0">Bounty</p>
				</div>
				<div>
					<h3 style="margin:0">7</h3>
					<p style="margin:0">Associates</p>
				</div>
			</div>
			<!--icon div-->
			<div style="color:smokewhite;font-size:18px;margin:30px 0 0 0;display:flex;justify-content:center;gap:30px">
				<i class="fa-brands fa-facebook-f" style="background-color:#A8060B;padding:8px;border-radius:50%"></i>
				<i class="fa-brands fa-discord" style="background-color:#A8060B;padding:8px;border-radius:50%"></i>
				<i class="fa-brands fa-twitch" style="background-color:#A8060B;padding:8px;border-radius:50%"></i>
				<i class="fa-brands fa-reddit-alien" style="background-color:#A8060B;padding:8px;border-radius:50%"></i>
				<i class="fa-brands fa-telegram" style="background-color:#A8060B;padding:8px;border-radius:50%"></i>
				<i class="fa-brands fa-pinterest" style="background-color:#A8060B;padding:8px;border-radius:50%"></i>
			</div>
			<!--button div-->
			<div style="display:flex;justify-content:center;gap:50px;margin:40px 0 0 0">
				<button style="padding:10px;width:120px;border:none;background-color:white;color:black;border-radius:20px"><b>Report Crime</b></button>
				<button style="padding:10px;width:120px;border:none;background-color:#A8060B;color:white;border-radius:20px"><b>Claim Bounty</b></button>
			</div>
		</div>
	</body>
</html>
