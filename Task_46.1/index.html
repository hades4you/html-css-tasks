<!doctype html>
<html>

<head>
    <title>Task_46.1</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <!-- overall page -->
    <div class="page">
        <!-- home / product display -->
        <main class="home">
            <!-- left half section of home with the product images -->
            <section class="home-left">
                <!-- product card that extends out left side of the display -->
                <article class="product-card">
                    <div class="product-card-top">
                        <!-- container for share and like icons at the top -->
                        <div class="product-header">
                            <i class="fa-solid fa-share-nodes"></i>
                            <i class="fa-solid fa-heart"></i>
                        </div>
                        <!-- hero img that extends out at the left side of the card -->
                        <img src="./apple-transparent.png" alt="hero-img" class="hero-img" />
                    </div>
                    <!-- container for the imgs slides at the bottom of the page -->
                    <div class="img-slide">
                        <div class="slide">
                            <img src="./pic-1-transparent.png" alt="pic-1" />
                        </div>
                        <div class="slide">
                            <img src="./pic-2-transparent.png" alt="pic-2" />
                        </div>
                        <div class="slide">
                            <img src="./pic-3-transparent.png" alt="pic-3" />
                        </div>
                        <div class="slide">
                            <img src="./pic-4-transparent.png" alt="pic-4" />
                        </div>
                    </div>
                </article>
            </section>
            <!-- right half of home with the product details -->
            <section class="home-right">
                <!-- product title and code container -->
                <div class="product-name-container">
                    <h1>Delicious Apples</h1>
                    <p>COD 10100</p>
                </div>
                <!-- product price and options container -->
                <div class="product-price-and-options">
                    <p class="price">&#8377; <span>30.00</span></p>
                    <p>SELECT A COLOR</p>
                    <!-- product options container -->
                    <div class="product-options">
                        <div class="option-container">
                            <img src="./apple-transparent.png" alt="red-apple" />
                        </div>
                        <div class="option-container">
                            <img src="./green-apple-transparent.png" alt="green-apple" />
                        </div>
                        <div class="option-container">
                            <img src="./orange-apple-transparent.png" alt="orange-apple" />
                        </div>
                        <div class="option-container">
                            <img src="./yellow-apple-transparent.png" alt="yellow-apple" />
                        </div>
                    </div>
                </div>
                <!-- benefits section -->
                <div class="benefits">
                    <p>BENEFITS</p>
                    <ul>
                        <li>Apples are nutricious</li>
                        <li>Apples may be good for weight loss</li>
                        <li>Apples may be good for bone health</li>
                        <li>They're linked to a lowest risk of diabetes</li>
                    </ul>
                </div>
                <!-- bottom btn -->
                <div class="btn-container">
                    <button class="btn"><b>ADD TO CART</b></button>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
