<!doctype html>
<html>

<head>
    <title>Task_45.2</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
    <!-- overall page -->
    <div class="page">
        <!-- form -->
        <form class="registration-form">
            <!-- form title -->
            <h1 class="form-title"><span>Re</span>gistration</h1>
            <!-- input row 1 -->
            <div class="input-row">
                <div class="input-container">
                    <label for="fname">Full Name</label>
                    <input type="text" name="fname" id="fname" class="fname" placeholder="Enter your Full Name" />
                </div>
                <div class="input-container">
                    <label for="uname">User Name</label>
                    <input type="text" name="uname" id="uname" class="uname" placeholder="Enter your User Name" />
                </div>
            </div>
            <!-- input row 2 -->
            <div class="input-row">
                <div class="input-container">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" class="email" placeholder="Enter your email" />
                </div>
                <div class="input-container">
                    <label for="phone">Phone Number</label>
                    <input type="number" name="phone" id="phone" class="phone" placeholder="Enter your Phone Number" />
                </div>
            </div>
            <!-- gender container -->
            <div class="gender-container">
                <p>Gender</p>
                <!-- gender row -->
                <div class="gender-row">
                    <div class="gender-option">
                        <input type="radio" name="gender" id="male" />
                        <label for="male">Male</label>
                    </div>
                    <div class="gender-option">
                        <input type="radio" name="gender" id="female" />
                        <label for="female">Female</label>
                    </div>
                    <div class="gender-option">
                        <input type="radio" name="gender" id="others" />
                        <label for="others">Others</label>
                    </div>
                </div>
            </div>
            <!-- register btn container -->
            <div class="form-btn-container">
                <!-- regsiter btn -->
                <button class="form-btn"><b>Register</b></button>
            </div>
        </form>
    </div>
</body>

</html>
