<!doctype html>
<html>

<head>
    <title>Task_33.2</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <!-- main -->
    <main class="main">
        <!-- home -->
        <div class="home">
            <!-- top card row -->
            <div class="card-row top-row">
                <!-- card 1 -->
                <div class="card">
                    <!--card 1 header -->
                    <header class="card-header">
                        <div class="card-header-left">
                            <p>Total hours</p>
                            <h1>17.00</h1>
                        </div>
                        <div class="card-header-right faded-text">
                            <i class="fa-regular fa-hourglass"></i>
                        </div>
                    </header>
                    <!-- card 1 footer -->
                    <footer class="card-footer">
                        <div class="table-wrapper">
                            <table class="card-table">
                                <tr>
                                    <td>Billable</td>
                                    <td><b>17.00</b></td>
                                </tr>
                                <tr>
                                    <td>Non-billable</td>
                                    <td class="faded-text">0.00</td>
                                </tr>
                            </table>
                        </div>
                    </footer>
                </div>
                <!-- card 2 -->
                <div class="card">
                    <!-- card 2 header -->
                    <header class="card-header">
                        <div class="card-header-left">
                            <p>Internal costs</p>
                            <h1><span><sup class="small-text">$</sup></span>611.37</h1>
                        </div>
                        <div class="card-header-right faded-text">
                            <i class="fa-solid fa-arrow-up"></i>
                        </div>
                    </header>
                    <!-- card 2 footer -->
                    <footer class="card-footer">
                        <div class="table-wrapper">
                            <table class="card-table">
                                <tr>
                                    <td>Billable</td>
                                    <td><b>$1,190.00</b></td>
                                </tr>
                                <tr>
                                    <td>Non-billable</td>
                                    <td class="blue-text">
                                        <b>$32.75</b>
                                        <i class="fa-solid fa-angle-right table-icon"></i>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </footer>
                </div>
            </div>
            <!-- bottom card row -->
            <div class="card-row">
                <!-- card 3 -->
                <div class="card">
                    <!-- card 3 header -->
                    <header class="card-header">
                        <div class="card-header-left">
                            <div class="card-3-title">
                                <p>Budget remaining</p>
                                <div class="info-icon"><i class="fa-solid fa-circle-info"></i></div>
                            </div>
                            <h1>8.00 <span><sup class="small-text blue-text">32%</sup></span></h1>
                        </div>
                        <div class="card-header-right faded-text">
                            <i class="fa-solid fa-wallet"></i>
                        </div>
                    </header>
                    <!-- card 3 footer -->
                    <footer class="card-footer">
                        <div class="budget-container">
                            <div class="budget-flex">
                                <p>Total budget</p>
                                <p><b>25.00</b></p>
                            </div>
                            <div class="progress-bar">
                                <div class="current-progress"></div>
                            </div>
                        </div>
                    </footer>
                </div>
                <!-- card 4 -->
                <div class="card">
                    <!-- card 4 header -->
                    <header class="card-header">
                        <div class="card-header-left">
                            <p>Unvoiced amount</p>
                            <h1><span><sup class="small-text">$</sup></span>1,716.37</h1>
                        </div>
                        <div class="card-header-right faded-text">
                            <i class="fa-solid fa-file-pen"></i>
                        </div>
                    </header>
                    <!-- card 4 footer -->
                    <footer class="card-footer">
                        <button class="invoice-btn">+ New Invoice</button>
                    </footer>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
