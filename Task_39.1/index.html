<!doctype html>
<html>

<head>
    <title>Task_39.1</title>
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <!-- overall -->
    <div class="page">
        <!-- card -->
        <section class="card">
            <!-- img -->
            <div class="img">
                <!-- bookmark icon -->
                <i class="fa-regular fa-bookmark bookmark-icon"></i>
            </div>
            <!-- content div -->
            <div class="content-container">
                <!-- content header -->
                <div class="content-header">
                    <!-- content heade left side div -->
                    <div class="content-header-left">
                        <h1 class="work">Home Decor <span>(Eco)</span></h1>
                        <h3 class="work-desc">Design, Maintainance</h3>
                    </div>
                    <!-- content header right side div -->
                    <div class="content-header-right">
                        <div class="rating-container">
                            <i class="fa-solid fa-star star-icon"></i>
                            <p class="rating">4.6/5</p>
                        </div>
                    </div>
                </div>
                <!-- content middle -->
                <div class="content-mid">
                    <!-- joining date div -->
                    <div class="content-mid-row">
                        <i class="fa-solid fa-calendar-days"></i>
                        <p>Joined Jan 2, 2020</p>
                    </div>
                    <!-- location div -->
                    <div class="content-mid-row">
                        <i class="fa-solid fa-location-dot"></i>
                        <p>Chennai</p>
                    </div>
                    <!-- time div -->
                    <div class="content-mid-row">
                        <i class="fa-solid fa-clock"></i>
                        <p>Sun-Fri<span>8 AM - 11 PM</span></p>
                    </div>
                </div>
                <!-- content footer -->
                <div class="content-footer">
                    <div class="content-footer-left">
                        <p>Start from</p>
                        <h3 class="cost">900 &#8377;<span>/hr</span></h3>
                    </div>
                    <div class="content-footer-right">
                        <button class="booking-btn"><b>Booking Now</b></button>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>

</html>
