<!doctype html>
<html>

<head>
    <title>Task_31.4</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- main -->
    <main class="main">
        <!-- content div -->
        <div class="home">
            <!-- header -->
            <header class="header">
                <h1 class="title">Connect With Us</h1>
                <p class="desc">We would like to respond to your queries and help you succeed.</p>
                <p class="desc desc-bottom">Feel free to get in touch with us.</p>
            </header>
            <!-- form and contact areas container -->
            <section class="form-area">
                <!-- form -->
                <form class="form">
                    <!-- form title -->
                    <h2 class="form-title">Send your request</h2>
                    <!-- 1st input row -->
                    <div class="input-row">
                        <div class="input-label-pair">
                            <label for="uname">Name</label>
                            <br />
                            <input type="text" class="uname" name="uname" id="uname" placeholder="John Doe" />
                        </div>
                        <div class="input-label-pair">
                            <label for="phone">Phone</label>
                            <br />
                            <input type="number" class="phone" name="phone" id="phone" placeholder="+00 102 201 1012" />
                        </div>
                    </div>
                    <!-- 2nd input row -->
                    <div class="input-row">
                        <div class="input-label-pair">
                            <label for="email">Email</label>
                            <br />
                            <input type="email" class="email" name="email" id="email" placeholder="johndoe@email.com" />
                        </div>
                        <div class="input-label-pair">
                            <label for="subject">Subject</label>
                            <br />
                            <input type="text" class="subject" name="subject" id="subject" placeholder="Product Demo" />
                        </div>
                    </div>
                    <!-- textarea container -->
                    <div class="message-container">
                        <label for="message">Message</label>
                        <div class="message-wrapper">
                            <textarea name="message" id="message" class="message" placeholder="Your Message"></textarea>
                        </div>
                    </div>
                    <!-- submit btb -->
                    <input type="submit" value="SEND" class="send" />
                </form>
                <!-- contacts div -->
                <aside class="contact">
                    <!-- contacts div title -->
                    <h2 class="contact-header">Reach Us</h2>
                    <!-- contacts table -->
                    <table class="contact-table">
                        <tr>
                            <td>Email</td>
                            <td class="contact-details">contactus@email.com</td>
                        </tr>
                        <tr>
                            <td>Phone</td>
                            <td class="contact-details">+00 001 110 1001</td>
                        </tr>
                        <tr>
                            <td>Email</td>
                            <td class="contact-details">#000, Ground Floor, Random Street, Random Area, TamilNadu,
                                Chennai 000000</td>
                        </tr>
                    </table>
                </aside>
            </section>
        </div>
    </main>
</body>

</html>
