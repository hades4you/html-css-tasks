<!doctype html>
<html>

<head>
    <title>Task_31.6</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- main -->
    <main class="main">
        <!-- card -->
        <section class="card">
            <!-- location and date-->
            <div class="content-wrapper">
                <header class="header">
                    <h1 class="location">Chennai</h1>
                    <p class="date">Tue, 7:00 AM, Mostly Sunny</p>
                </header>
                <!-- temperature -->
                <article class="mid-section">
                    <p class="temperature">28<sup><span class="deg">&deg;C</span></sup></p>
                    <img src="./sun.gif" alt="sun" class="sun-img">
                </article>
                <!-- rain and wind -->
                <footer class="footer">
                    <div class="cloud-div">
                        <img src="./dark-cloud.webp" alt="cloud" class="cloud-img">
                        <p class="rain-potential">48% Precipitation</p>
                    </div>
                    <div class="wind-div">
                        <img src="./wind-2.png" alt="wind" class="wind-img">
                        <p class="wind-speed">15.5km/h Winds</p>
                    </div>
                </footer>
            </div>
        </section>
    </main>
</body>

</html>
